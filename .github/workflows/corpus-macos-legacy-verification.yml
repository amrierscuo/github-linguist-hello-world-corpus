name: Legacy compiler verification

on:
  push:
    branches: [codex/corpus-macos-legacy-20261122]
    paths: [.github/workflows/corpus-macos-legacy-verification.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - name: Fetch the exact corpus snapshot
        env:
          SOURCE_COMMIT: 5e6c4391ced56263f84a02d6fc6adc0e75233352
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init --quiet corpus
          git -C corpus fetch --no-tags --depth 1 https://github.com/amrierscuo/github-linguist-hello-world-corpus.git "$SOURCE_COMMIT"
          git -C corpus checkout --detach FETCH_HEAD
          test "$(git -C corpus rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Run the official Cycript command-line runtime
        continue-on-error: true
        shell: bash
        run: |
          stage="$(mktemp -d)"
          export stage
          export CYCRIPT_URL='https://cache.saurik.com/cycript/mac/cycript_0.9.594.zip'
          export PYTHON27_URL='https://www.python.org/ftp/python/2.7.18/python-2.7.18-macosx10.9.pkg'
          curl -fsSL --retry 2 --max-time 70 "$CYCRIPT_URL" -o "$stage/cycript.zip"
          ditto -x -k "$stage/cycript.zip" "$stage/sdk"
          curl -fsSL --retry 2 --max-time 70 "$PYTHON27_URL" -o "$stage/python.pkg"
          test "$(md5 -q "$stage/python.pkg")" = 'ce98eeb7bdf806685adc265ec1444463'
          pkgutil --expand-full "$stage/python.pkg" "$stage/python"
          cd corpus
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import platform
          import subprocess

          stage = Path(os.environ['stage'])
          source = Path('examples/#147 Cycript/hello.cy')
          (stage / source.name).write_bytes(source.read_bytes())
          native = stage / 'sdk/Cycript.lib/cycript-apl'
          assert native.is_file() and os.access(native, os.X_OK)
          exe = str(native)
          frameworks = [path for path in (stage / 'python').rglob('Python.framework')
                        if (path / 'Versions/2.7/Python').is_file()]
          if frameworks:
              framework = frameworks[0]
          else:
              libraries = [path for path in (stage / 'python').rglob('Python')
                           if path.is_file() and not path.is_symlink()]
              print('Python package framework payloads:', [str(p.relative_to(stage)) for p in libraries], flush=True)
              assert len(libraries) == 1, libraries
              framework = stage / 'Frameworks/Python.framework'
              (framework / 'Versions').mkdir(parents=True)
              (framework / 'Versions/2.7').symlink_to(libraries[0].parent, target_is_directory=True)
          env = os.environ | {'DYLD_FRAMEWORK_PATH': str(framework.parent),
                              'DYLD_LIBRARY_PATH': str(native.parent),
                              'PYTHONHOME': str(framework / 'Versions/2.7')}
          receipt = {
              'schema_version': 1, 'ordinal': 147, 'language': 'Cycript',
              'timestamp_utc': datetime.now(timezone.utc).isoformat(), 'platform': platform.platform(),
              'artifact_sha256': {str(source): sha256(source.read_bytes()).hexdigest()},
              'toolchain_archives': [
                  {'url': os.environ['CYCRIPT_URL'], 'sha256': sha256((stage / 'cycript.zip').read_bytes()).hexdigest()},
                  {'url': os.environ['PYTHON27_URL'], 'sha256': sha256((stage / 'python.pkg').read_bytes()).hexdigest()},
              ],
              'commands': [],
          }
          for label, args in [
              ('Identify the official Cycript binary', ['file', exe]),
              ('Read Cycript compiler version and options', [exe, '--help']),
              ('Compile original Cycript source', [exe, '-c', source.name]),
              ('Execute original Cycript source with JavaScriptCore', [exe, source.name]),
          ]:
              try:
                  result = subprocess.run(args, cwd=stage, env=env, stdin=subprocess.DEVNULL,
                                          capture_output=True, text=True, timeout=30)
              except OSError as error:
                  result = subprocess.CompletedProcess(args, 126, '', str(error))
              command = [arg.replace(str(stage), '${SCRATCH}') for arg in args]
              receipt['commands'].append({'label': label, 'command': command, 'exit_code': result.returncode,
                                          'stdout': result.stdout, 'stderr': result.stderr})
          print('CORPUS_PROOF ' + json.dumps(receipt), flush=True)
          PY

      - name: Extract the historical Opa compiler without installing the package
        shell: bash
        run: |
          stage="$(mktemp -d)"
          export stage
          export PACKAGE_URL='https://github.com/MLstate/opalang/releases/download/v4308/opa-1.1.1.dmg'
          curl -fsSL --retry 2 --max-time 70 "$PACKAGE_URL" -o "$stage/opa.dmg"
          mkdir "$stage/mounted"
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$stage/mounted" "$stage/opa.dmg"
          trap 'hdiutil detach "$stage/mounted"' EXIT
          package="$stage/mounted/opa-4308.pkg"
          test -f "$package"
          pkgutil --expand-full "$package" "$stage/package"
          cd corpus
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import platform
          import socket
          import subprocess
          import time
          from urllib.request import urlopen

          stage = Path(os.environ['stage'])
          source = Path('examples/#497 Opa/hello.opa')
          (stage / source.name).write_bytes(source.read_bytes())
          contents = list((stage / 'package').rglob('*'))
          print('Package layout:', [str(path.relative_to(stage)) for path in contents
                                    if path.name in ('opa', 'opa-bin', 'opa.exe', 'opa.sh', 'Payload', 'PackageInfo', 'stdlib')][:45], flush=True)
          programs = sorted((path for path in contents if path.name in ('opa', 'opa-bin', 'opa.exe', 'opa.sh')
                             and path.is_file() and os.access(path, os.X_OK)),
                            key=lambda path: (path.name != 'opa', path.parent.name != 'bin', len(path.parts)))
          assert programs, 'No Opa compiler executable in the package'
          print('Compiler positions:', [str(p.relative_to(stage)) for p in programs], flush=True)
          program = programs[0]
          env = os.environ.copy()
          env['PATH'] = str(program.parent) + ':' + env['PATH']
          stdlib = next((path for path in contents if path.name == 'stdlib' and path.parent.name == 'opa'), None)
          assert stdlib is not None
          env['MLSTATELIBS'] = str(stdlib.parents[2])
          env['NODE_PATH'] = os.pathsep.join(str(path) for path in contents if path.name == 'node_modules' and path.is_dir())
          receipt = {
              'schema_version': 1, 'ordinal': 497, 'language': 'Opa',
              'timestamp_utc': datetime.now(timezone.utc).isoformat(), 'platform': platform.platform(),
              'artifact_sha256': {str(source): sha256(source.read_bytes()).hexdigest()},
              'toolchain_archives': [{'url': env['PACKAGE_URL'], 'sha256': sha256((stage / 'opa.dmg').read_bytes()).hexdigest()}],
              'commands': [],
          }
          for label, args in [
              ('Identify official Opa binary', ['file', str(program)]),
              ('Identify Opa compiler version', [str(program), '--version']),
              ('Read Opa command-line options', [str(program), '--help']),
              ('Identify the Node.js host', ['node', '--version']),
              ('Compile original Opa source', [str(program), '-o', 'corpus-greeting.js', source.name]),
          ]:
              result = subprocess.run(args, cwd=stage, env=env, stdin=subprocess.DEVNULL,
                                      capture_output=True, text=True, timeout=90)
              command = [arg.replace(str(stage), '${SCRATCH}') for arg in args]
              receipt['commands'].append({'label': label, 'command': command, 'exit_code': result.returncode,
                                          'stdout': result.stdout[:10000], 'stderr': result.stderr[:10000]})
          executable = stage / 'corpus-greeting.js'
          if receipt['commands'][-1]['exit_code'] == 0 and executable.is_file():
              with socket.socket() as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              args = ['node', executable.name, '-a', '127.0.0.1', '-p', str(port)]
              url = f'http://127.0.0.1:{port}/'
              response_body = ''
              response_status = None
              with (stage / 'server.log').open('wb') as output:
                  process = subprocess.Popen(args, cwd=stage, env=env, stdin=subprocess.DEVNULL,
                                             stdout=output, stderr=subprocess.STDOUT)
                  try:
                      until = time.monotonic() + 25
                      while process.poll() is None and time.monotonic() < until:
                          try:
                              with urlopen(url, timeout=2) as response:
                                  response_status = response.status
                                  response_body = response.read(65536).decode('utf-8')
                              break
                          except OSError:
                              time.sleep(0.4)
                  finally:
                      stopped = process.poll() is None
                      if stopped:
                          process.terminate()
                      process.wait(timeout=10)
              receipt['commands'].extend([
                  {'label': 'Run the compiled Opa server on loopback', 'command': args, 'exit_code': process.returncode,
                   'stdout': (stage / 'server.log').read_text(errors='replace')[:10000], 'stderr': '',
                   'stopped_after_observation': stopped},
                  {'label': 'Read the output at the loopback HTTP endpoint', 'command': ['GET', url],
                   'http_status': response_status, 'stdout': response_body, 'stderr': '',
                   'exit_code': 0 if response_status == 200 and '<h1>Hello, World!</h1>' in response_body else 1},
              ])
          print('Output files:', sorted(p.name for p in stage.iterdir()), flush=True)
          print('CORPUS_PROOF ' + json.dumps(receipt), flush=True)
          PY
